name: bakeoff

# Base-image bake-off for the bench image: ubuntu 24.04 vs debian trixie-slim
# vs wolfi vs a Nix-built image, the same tools in each, measured on
# GitHub-hosted runners. Nothing here is built or measured locally. See
# bakeoff/README.md.
#
# build:   each Dockerfile variant (amd64), pushed to ghcr.io/comlineproject/ci-bakeoff:<variant>;
#          sizes and build time. build-nix does the same for the flake in
#          bakeoff/nix (nix build, pushed with nix2container's skopeo), and
#          also checks that a rebuild is bit-identical and runs vulnix.
# measure: pull by digest, then core's instruction-count bench in it (3 runs),
#          plus the runner VM as today (apt + cargo install), and a Trivy scan.
# container-smoke: the nix image as a real `container:` job.
# report:  the tables, in the job summary and bakeoff/RESULTS.md (an artifact).
#
# A run that only changes bakeoff/RESULTS.md (the committed results) is skipped.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bakeoff.yml"
      - "bakeoff/**"
      - "!bakeoff/RESULTS.md"
      - "rust/fetch.sh"

permissions:
  contents: read

concurrency:
  group: bakeoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/comlineproject/ci-bakeoff
  # core master's HEAD when this was written (2026-11-12). Fixed, so every
  # leg benches the same source.
  CORE_SHA: f9d53265b82c86502439fea1759e256973865853

jobs:
  # core does not commit a Cargo.lock, so the dependencies would resolve at job
  # time, differently if a crate published between two legs. One lockfile,
  # generated once, is used by every leg.
  lock:
    name: core's Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ComlineProject/core
          ref: ${{ env.CORE_SHA }}
          persist-credentials: false
      - name: Generate the lockfile
        run: |
          test ! -e Cargo.lock
          cargo generate-lockfile
          wc -l Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 14

  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, debian, wolfi]
    env:
      VARIANT: ${{ matrix.variant }}
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the build clock
        run: echo "BUILD_START=$(date +%s.%N)" >> "$GITHUB_ENV"
      # No layer cache: the build time is a cold build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bakeoff/${{ matrix.variant }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ matrix.variant }}
          build-args: REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Stop the build clock
        run: echo "BUILD_END=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Sizes, push, digest
        run: |
          set -euo pipefail
          uncompressed=$(docker image inspect "$IMAGE:$VARIANT" --format '{{.Size}}')
          docker push "$IMAGE:$VARIANT" | tee push.log
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -n 1)
          [[ "$digest" == sha256:* ]] || { echo "no digest in the push output" >&2; exit 1; }
          # The compressed size: the layers of the image manifest, as the registry holds them.
          docker buildx imagetools inspect --raw "$IMAGE@$digest" > manifest.json
          if jq -e '.manifests' manifest.json > /dev/null; then
            m=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' manifest.json)
            docker buildx imagetools inspect --raw "$IMAGE@$m" > manifest.json
          fi
          compressed=$(jq '[.layers[].size] | add' manifest.json)
          build_seconds=$(awk -v a="$BUILD_END" -v b="$BUILD_START" 'BEGIN { printf "%.1f", a - b }')
          mkdir -p out
          jq -n --arg variant "$VARIANT" --arg image "$IMAGE" --arg digest "$digest" \
            --argjson compressed "$compressed" --argjson uncompressed "$uncompressed" \
            --argjson build_seconds "$build_seconds" --argjson layers "$(jq '.layers | length' manifest.json)" \
            '{variant: $variant, image: $image, digest: $digest, compressed_bytes: $compressed,
              uncompressed_bytes: $uncompressed, build_seconds: $build_seconds, layers: $layers}' > out/build.json
          cat out/build.json
          {
            echo "### $VARIANT"
            echo
            echo "- digest: \`$digest\`"
            echo "- compressed: $((compressed / 1000000)) MB, uncompressed: $((uncompressed / 1000000)) MB, build: ${build_seconds} s"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.variant }}
          path: out/build.json
          if-no-files-found: error
          retention-days: 14

  # The Nix variant. Not a Dockerfile: the image is built from bakeoff/nix
  # (flake.nix, with flake.lock pinning nixpkgs, rust-overlay and nix2container
  # by rev and narHash) and pushed with nix2container's skopeo. The Nix store
  # starts empty on a fresh runner and the build has no cache of its own (no
  # magic-nix-cache, no actions/cache), but Nix substitutes the packages
  # nixpkgs publishes from cache.nixos.org, so "no cache" here means a cold
  # local store, not a build of everything from source. Only the
  # iai-callgrind-runner (cargo build from the crates.io source), the layer
  # metadata and the image itself are built here.
  build-nix:
    name: build (nix)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VARIANT: nix
      FLAKE: ./bakeoff/nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          # Only so the flake inputs (github:) are fetched with a token, not
          # anonymously (rate limits).
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check that flake.lock is in sync with flake.nix
        run: |
          set -euo pipefail
          nix --version
          # Fails if the lock would have to change.
          nix flake metadata "$FLAKE" --no-update-lock-file --json \
            | jq -r '.locks.nodes | to_entries[] | select(.value.locked) | "\(.key) \(.value.locked.rev) \(.value.locked.narHash)"'
      # The build clock: `nix build` of the image alone (evaluation, the
      # substitutions, the iai-callgrind-runner build, the layers). The tool
      # that pushes (skopeo-nix2container) is not in it, as docker push is not
      # in the other variants'; it is timed on its own below.
      - name: Build the image
        run: |
          set -euo pipefail
          start=$(date +%s.%N)
          nix build "$FLAKE#bench-image" --print-build-logs --out-link result-image 2>&1 | tee nix-build.log
          end=$(date +%s.%N)
          echo "BUILD_SECONDS=$(awk -v a="$end" -v b="$start" 'BEGIN { printf "%.1f", a - b }')" >> "$GITHUB_ENV"
          # What Nix said it would build and fetch.
          grep -E 'will be built|will be fetched|derivations? will be|paths? will be' nix-build.log | tr '\n' ' ' > nix-plan.txt || true
          cat nix-plan.txt; echo
          readlink -f result-image
      - name: Build the push tool (not in the build time)
        run: |
          set -euo pipefail
          start=$(date +%s.%N)
          nix build "$FLAKE#bench-image.copyTo" --print-build-logs --no-link
          end=$(date +%s.%N)
          echo "TOOL_SECONDS=$(awk -v a="$end" -v b="$start" 'BEGIN { printf "%.1f", a - b }')" >> "$GITHUB_ENV"
      - name: Push
        id: push
        run: |
          set -euo pipefail
          nix run "$FLAKE#bench-image.copyTo" -- "docker://$IMAGE:$VARIANT" \
            --dest-authfile "$HOME/.docker/config.json" --digestfile digest.txt
          digest=$(cat digest.txt)
          [[ "$digest" == sha256:* ]] || { echo "no digest from skopeo" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Sizes
        run: |
          set -euo pipefail
          # Uncompressed: what Docker holds after pulling it, as `docker image
          # inspect` .Size is for the other variants. Compressed: the layers of
          # the image manifest, as the registry holds them.
          docker pull "$IMAGE@$DIGEST" > /dev/null
          uncompressed=$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Size}}')
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > manifest.json
          if jq -e '.manifests' manifest.json > /dev/null; then
            m=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' manifest.json)
            docker buildx imagetools inspect --raw "$IMAGE@$m" > manifest.json
          fi
          compressed=$(jq '[.layers[].size] | add' manifest.json)
          mkdir -p out
          cp manifest.json out/manifest.json
          jq -n --arg variant "$VARIANT" --arg image "$IMAGE" --arg digest "$DIGEST" \
            --argjson compressed "$compressed" --argjson uncompressed "$uncompressed" \
            --argjson build_seconds "$BUILD_SECONDS" --argjson tool_seconds "$TOOL_SECONDS" \
            --argjson layers "$(jq '.layers | length' manifest.json)" --arg plan "$(cat nix-plan.txt)" \
            '{variant: $variant, image: $image, digest: $digest, compressed_bytes: $compressed,
              uncompressed_bytes: $uncompressed, build_seconds: $build_seconds,
              push_tool_build_seconds: $tool_seconds, layers: $layers, nix_plan: $plan}' > out/build.json
          cat out/build.json

      # Reproducibility: `nix-store --realise --check` builds a derivation again
      # and fails if its output differs from the one in the store. That is done
      # for every derivation of the flake that is built on the runner (the
      # layer metadata, the image's JSON, the environment, the skeleton and the
      # iai-callgrind-runner, a real cargo build); the packages substituted
      # from cache.nixos.org are not rebuilt (that would be building glibc and
      # gcc). The image is exported (the
      # layers compressed, to a directory) before and after, and the manifest
      # digests and layer digests of the two exports are compared; the first
      # export is also compared with what was pushed.
      - name: Rebuild and compare
        run: |
          # Not -e: a failed rebuild is a result, not an error.
          set +e -uo pipefail
          export_image() { # directory
            rm -rf "$1"
            nix run "$FLAKE#bench-image.copyTo" -- "dir:$1" --dest-compress > "out/export-$(basename "$1").log" 2>&1
            echo "sha256:$(sha256sum "$1/manifest.json" | cut -d' ' -f1)"
          }
          first=$(export_image "$PWD/export1")
          checked=0; failed=0; : > out/rebuilt.txt
          drv=$(nix path-info --derivation "$FLAKE#bench-image")
          for d in $(nix-store --query --requisites "$drv" | grep -E -- '-(layers\.json|closure-graph\.json|image-ci-bakeoff\.json|skeleton|dir|bench-env|iai-callgrind-runner-0\.16\.1)\.drv$'); do
            if nix-store --realise --check "$d" > "out/check-$(basename "$d").log" 2>&1; then r=identical; else r=DIFFERS; failed=$((failed + 1)); fi
            checked=$((checked + 1)); echo "$r $(basename "$d")" | tee -a out/rebuilt.txt
          done
          second=$(export_image "$PWD/export2")
          manifest_same=false; [ "$second" = "$first" ] && manifest_same=true
          layers_same=false
          [ "$(jq -c '[.layers[].digest]' export1/manifest.json)" = "$(jq -c '[.layers[].digest]' export2/manifest.json)" ] && layers_same=true
          pushed_same=false; [ "$first" = "$DIGEST" ] && pushed_same=true
          identical=false
          [ "$checked" -gt 0 ] && [ "$failed" = 0 ] && [ "$manifest_same" = true ] && identical=true
          jq -n --argjson checked "$checked" --argjson failed "$failed" --rawfile list out/rebuilt.txt \
            --arg first "$first" --arg second "$second" --arg pushed "$DIGEST" --argjson pushed_same "$pushed_same" \
            --argjson manifest_same "$manifest_same" --argjson layers_same "$layers_same" --argjson identical "$identical" \
            '{rechecked_derivations: $checked, differing_derivations: $failed,
              derivations: ($list | split("\n") | map(select(length > 0))),
              first_manifest_digest: $first, second_manifest_digest: $second,
              pushed_manifest_digest: $pushed, first_export_equals_pushed: $pushed_same,
              manifest_identical: $manifest_same, layers_identical: $layers_same, bit_identical: $identical}' > out/repro.json
          cat out/repro.json
          jq --slurpfile r out/repro.json '. + {repro: $r[0]}' out/build.json > out/build.tmp && mv out/build.tmp out/build.json

      # The Nix-aware CVE scan: vulnix, from the same nixpkgs, over the
      # runtime closure of the image's environment (everything under the
      # image's /nix/store). A CVE is counted once per (package, CVE) pair,
      # as Trivy counts a vulnerability once per package. HIGH+CRITICAL is
      # CVSS v3 base score >= 7.0; vulnix has no fix information.
      - name: vulnix
        run: |
          # Not -e: vulnix exits 2 when it finds something.
          set +e -uo pipefail
          env_path=$(nix build "$FLAKE#bench-env" --no-link --print-out-paths)
          nix build "$FLAKE#vulnix" --no-link
          nix run "$FLAKE#vulnix" -- --version 2>/dev/null | tail -n 1 | tee out/vulnix-version.txt
          nix run "$FLAKE#vulnix" -- --closure --json "$env_path" > out/vulnix.json 2> out/vulnix.err
          rc=$?
          echo "vulnix exit status: $rc (0: nothing found, 2: vulnerabilities found)"
          tail -5 out/vulnix.err
          head -c 600 out/vulnix.json; echo
          ver=$(cat out/vulnix-version.txt)
          if [ "$rc" -gt 2 ] || ! jq -e 'type == "array"' out/vulnix.json > /dev/null 2>&1; then
            echo "vulnix failed" >&2
            jq --arg ver "$ver" --argjson rc "$rc" '. + {vulnix: {failed: true, exit_status: $rc, version: $ver}}' out/build.json > out/build.tmp
          else
            jq --slurpfile found out/vulnix.json --arg ver "$ver" --argjson rc "$rc" '
              ($found[0] | [ .[] | . as $d | ($d.affected_by // [])[] as $cve
                | {pkg: $d.name, cve: $cve, score: (($d.cvssv3_basescore // {})[$cve])} ]) as $v
              | . + {vulnix: {
                  failed: false, exit_status: $rc, version: $ver,
                  total: ($v | length),
                  unique_cves: ($v | map(.cve) | unique | length),
                  high_critical: ([$v[] | select(.score != null and .score >= 7.0)] | length),
                  critical: ([$v[] | select(.score != null and .score >= 9.0)] | length),
                  unscored: ([$v[] | select(.score == null)] | length),
                  packages_affected: ($v | map(.pkg) | unique | length)}}' out/build.json > out/build.tmp
          fi
          mv out/build.tmp out/build.json
          jq .vulnix out/build.json
      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### nix"
            echo
            echo "- digest: \`$DIGEST\`"
            echo "- build (nix build of the image): ${BUILD_SECONDS} s; push tool build: ${TOOL_SECONDS} s"
            echo "- $(cat nix-plan.txt)"
            jq -r '"- compressed: \(.compressed_bytes / 1000000 | floor) MB, uncompressed: \(.uncompressed_bytes / 1000000 | floor) MB, layers: \(.layers)"' out/build.json
            echo '- reproducibility:'; jq -c .repro out/build.json | sed 's/^/  /'
            echo '- vulnix:'; jq -c .vulnix out/build.json | sed 's/^/  /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: build-nix
          path: out
          if-no-files-found: error
          retention-days: 14

  measure:
    name: measure (${{ matrix.variant }}, run ${{ matrix.run }})
    needs: [lock, build, build-nix]
    # A variant that failed to build fails its own legs; the others still run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, debian, wolfi, nix, vm]
        run: [1, 2, 3]
    env:
      VARIANT: ${{ matrix.variant }}
      RUN_NUMBER: ${{ matrix.run }}
    steps:
      # The job clock covers everything from here to the end of the bench.
      - name: Start the job clock
        run: echo "JOB_START=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ComlineProject/core
          ref: ${{ env.CORE_SHA }}
          path: core-src
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-lock
          path: core-src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.variant != 'vm'
        with:
          name: build-${{ matrix.variant }}
          path: ${{ runner.temp }}/build
      - name: Prepare
        run: mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/iai"

      # Containers: the pull is its own step, so it is timed alone, on a runner
      # that has never seen the image; the bench then runs in `docker run` on
      # the pulled image. (With `container:` the runner would pull the image
      # itself, in a step that cannot be timed.) The login is before the timer.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: matrix.variant != 'vm'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image by digest
        if: matrix.variant != 'vm'
        run: |
          set -euo pipefail
          digest=$(jq -r .digest "$RUNNER_TEMP/build/build.json")
          echo "IMAGE_REF=$IMAGE@$digest" >> "$GITHUB_ENV"
          start=$(date +%s.%N)
          docker pull "$IMAGE@$digest"
          end=$(date +%s.%N)
          echo "PULL_SECONDS=$(awk -v a="$end" -v b="$start" 'BEGIN { printf "%.1f", a - b }')" >> "$GITHUB_ENV"
      - name: Bench in the container
        if: matrix.variant != 'vm'
        run: |
          set -euo pipefail
          # Same paths in every variant: core at /work, bench.sh sets the rest.
          # seccomp=unconfined: iai-callgrind's runner calls `setarch -R` to
          # switch ASLR off, and Docker's default seccomp profile refuses the
          # personality() call ("setarch: failed to set personality to x86_64:
          # Operation not permitted") and fails the bench. The first run of
          # this workflow failed there on ubuntu and debian.
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD/core-src:/work" -v "$PWD/bakeoff:/bakeoff:ro" \
            -v "$RUNNER_TEMP/out:/out" -v "$RUNNER_TEMP/iai:/tmp/iai" \
            -w /work "$IMAGE_REF" sh /bakeoff/bench.sh

      # The VM: today's setup, no container. valgrind from apt and the runner
      # from crates.io (core's bench.yml caches the runner between runs; this
      # leg has a cold cache, like the first run after an eviction).
      - name: Set up the VM (apt, cargo install)
        if: matrix.variant == 'vm'
        run: |
          set -euo pipefail
          start=$(date +%s.%N)
          sudo apt-get update
          sudo apt-get install -y valgrind
          cargo install iai-callgrind-runner --version 0.16.1 --locked
          end=$(date +%s.%N)
          echo "SETUP_SECONDS=$(awk -v a="$end" -v b="$start" 'BEGIN { printf "%.1f", a - b }')" >> "$GITHUB_ENV"
      - name: Bench on the VM
        if: matrix.variant == 'vm'
        run: |
          set -euo pipefail
          # The same paths as in the containers.
          sudo mkdir -p /work /tmp/iai
          sudo mount --bind "$PWD/core-src" /work
          sudo mount --bind "$RUNNER_TEMP/iai" /tmp/iai
          cd /work
          OUT="$RUNNER_TEMP/out" sh "$GITHUB_WORKSPACE/bakeoff/bench.sh"

      - name: Stop the job clock
        run: echo "JOB_END=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Collect the counts and timings
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/out/phases.env"
          python3 -I bakeoff/extract.py "$RUNNER_TEMP/iai" > "$RUNNER_TEMP/out/counts.json"
          cat "$RUNNER_TEMP/out/counts.json"
          mkdir -p "$RUNNER_TEMP/out/summaries"
          (cd "$RUNNER_TEMP/iai" && find . -name summary.json -print0 | tar --null -T - -cf -) | tar -xf - -C "$RUNNER_TEMP/out/summaries"
          job_seconds=$(awk -v a="$JOB_END" -v b="$JOB_START" 'BEGIN { printf "%.1f", a - b }')
          jq -n --arg variant "$VARIANT" --argjson run "$RUN_NUMBER" \
            --argjson pull "${PULL_SECONDS:-null}" --argjson setup "${SETUP_SECONDS:-null}" \
            --argjson compile "$compile_seconds" --argjson bench "$bench_seconds" --argjson job "$job_seconds" \
            '{variant: $variant, run: $run, pull_seconds: $pull, setup_seconds: $setup,
              compile_seconds: $compile, bench_seconds: $bench, job_seconds: $job}' > "$RUNNER_TEMP/out/measure.json"
          cat "$RUNNER_TEMP/out/measure.json"
          cat "$RUNNER_TEMP/out/env.txt"

      # The CVE scan: once per image, after the timed part, of the pulled
      # image (Trivy reads it from the local daemon).
      - name: Trivy scan
        if: matrix.variant != 'vm' && matrix.run == 1
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/out/trivy.json
          exit-code: "0"
      - name: Count the CVEs
        if: matrix.variant != 'vm' && matrix.run == 1
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          jq '[.Results[]?.Vulnerabilities[]?] as $v | {
                total: ($v | length),
                high_critical: ([$v[] | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length),
                high_critical_fixed: ([$v[] | select((.Severity == "HIGH" or .Severity == "CRITICAL") and ((.FixedVersion // "") != ""))] | length)
              }' "$out/trivy.json" > "$out/cve.json"
          jq --slurpfile cve "$out/cve.json" '. + {cve: $cve[0]}' "$out/measure.json" > "$out/measure.tmp"
          mv "$out/measure.tmp" "$out/measure.json"
          cat "$out/cve.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: measure-${{ matrix.variant }}-${{ matrix.run }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  # The nix image as a job container, as `container:` does it: the runner
  # starts it, mounts its own node (a glibc binary, run through the image's
  # /lib64/ld-linux-x86-64.so.2) and runs the steps in it.
  container-smoke:
    name: nix image as a job container
    needs: build-nix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/comlineproject/ci-bakeoff@${{ needs.build-nix.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools, paths, certificates
        run: |
          set -eu
          sh bakeoff/envinfo.sh
          echo "uid=$(id -u) HOME=$HOME CARGO_HOME=$CARGO_HOME PATH=$PATH"
          command -v sh env
          /usr/bin/env true
          touch "$HOME/.writable" /tmp/.writable "$CARGO_HOME/.writable"
          git ls-remote https://github.com/ComlineProject/ci-images HEAD
          setarch -R true
          valgrind --tool=none true

  report:
    name: report
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Write the tables
        run: |
          set -euo pipefail
          python3 -I bakeoff/report.py "$RUNNER_TEMP/artifacts" > bakeoff/RESULTS.md
          cat bakeoff/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: bakeoff/RESULTS.md
          if-no-files-found: error
          retention-days: 30
