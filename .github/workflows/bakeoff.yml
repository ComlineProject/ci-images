name: bakeoff

# Base-image bake-off for the bench image: ubuntu 24.04 vs debian trixie-slim
# vs wolfi, the same tools in each, measured on GitHub-hosted runners. Nothing
# here is built or measured locally. See bakeoff/README.md.
#
# build:   each variant (amd64), pushed to ghcr.io/comlineproject/ci-bakeoff:<variant>;
#          sizes and build time.
# measure: pull by digest, then core's instruction-count bench in it (3 runs),
#          plus the runner VM as today (apt + cargo install), and a Trivy scan.
# report:  the tables, in the job summary and bakeoff/RESULTS.md (an artifact).
#
# A run that only changes bakeoff/RESULTS.md (the committed results) is skipped.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bakeoff.yml"
      - "bakeoff/**"
      - "!bakeoff/RESULTS.md"
      - "rust/fetch.sh"

permissions:
  contents: read

concurrency:
  group: bakeoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/comlineproject/ci-bakeoff
  # core master's HEAD when this was written (2026-11-12). Fixed, so every
  # leg benches the same source.
  CORE_SHA: f9d53265b82c86502439fea1759e256973865853

jobs:
  # core does not commit a Cargo.lock, so the dependencies would resolve at job
  # time, differently if a crate published between two legs. One lockfile,
  # generated once, is used by every leg.
  lock:
    name: core's Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ComlineProject/core
          ref: ${{ env.CORE_SHA }}
          persist-credentials: false
      - name: Generate the lockfile
        run: |
          test ! -e Cargo.lock
          cargo generate-lockfile
          wc -l Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 14

  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, debian, wolfi]
    env:
      VARIANT: ${{ matrix.variant }}
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the build clock
        run: echo "BUILD_START=$(date +%s.%N)" >> "$GITHUB_ENV"
      # No layer cache: the build time is a cold build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bakeoff/${{ matrix.variant }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ matrix.variant }}
          build-args: REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Stop the build clock
        run: echo "BUILD_END=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Sizes, push, digest
        run: |
          set -euo pipefail
          uncompressed=$(docker image inspect "$IMAGE:$VARIANT" --format '{{.Size}}')
          docker push "$IMAGE:$VARIANT" | tee push.log
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -n 1)
          [[ "$digest" == sha256:* ]] || { echo "no digest in the push output" >&2; exit 1; }
          # The compressed size: the layers of the image manifest, as the registry holds them.
          docker buildx imagetools inspect --raw "$IMAGE@$digest" > manifest.json
          if jq -e '.manifests' manifest.json > /dev/null; then
            m=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' manifest.json)
            docker buildx imagetools inspect --raw "$IMAGE@$m" > manifest.json
          fi
          compressed=$(jq '[.layers[].size] | add' manifest.json)
          build_seconds=$(awk -v a="$BUILD_END" -v b="$BUILD_START" 'BEGIN { printf "%.1f", a - b }')
          mkdir -p out
          jq -n --arg variant "$VARIANT" --arg image "$IMAGE" --arg digest "$digest" \
            --argjson compressed "$compressed" --argjson uncompressed "$uncompressed" \
            --argjson build_seconds "$build_seconds" --argjson layers "$(jq '.layers | length' manifest.json)" \
            '{variant: $variant, image: $image, digest: $digest, compressed_bytes: $compressed,
              uncompressed_bytes: $uncompressed, build_seconds: $build_seconds, layers: $layers}' > out/build.json
          cat out/build.json
          {
            echo "### $VARIANT"
            echo
            echo "- digest: \`$digest\`"
            echo "- compressed: $((compressed / 1000000)) MB, uncompressed: $((uncompressed / 1000000)) MB, build: ${build_seconds} s"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.variant }}
          path: out/build.json
          if-no-files-found: error
          retention-days: 14

  measure:
    name: measure (${{ matrix.variant }}, run ${{ matrix.run }})
    needs: [lock, build]
    # A variant that failed to build fails its own legs; the others still run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, debian, wolfi, vm]
        run: [1, 2, 3]
    env:
      VARIANT: ${{ matrix.variant }}
      RUN_NUMBER: ${{ matrix.run }}
    steps:
      # The job clock covers everything from here to the end of the bench.
      - name: Start the job clock
        run: echo "JOB_START=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ComlineProject/core
          ref: ${{ env.CORE_SHA }}
          path: core-src
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-lock
          path: core-src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.variant != 'vm'
        with:
          name: build-${{ matrix.variant }}
          path: ${{ runner.temp }}/build
      - name: Prepare
        run: mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/iai"

      # Containers: the pull is its own step, so it is timed alone, on a runner
      # that has never seen the image; the bench then runs in `docker run` on
      # the pulled image. (With `container:` the runner would pull the image
      # itself, in a step that cannot be timed.) The login is before the timer.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: matrix.variant != 'vm'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image by digest
        if: matrix.variant != 'vm'
        run: |
          set -euo pipefail
          digest=$(jq -r .digest "$RUNNER_TEMP/build/build.json")
          echo "IMAGE_REF=$IMAGE@$digest" >> "$GITHUB_ENV"
          start=$(date +%s.%N)
          docker pull "$IMAGE@$digest"
          end=$(date +%s.%N)
          echo "PULL_SECONDS=$(awk -v a="$end" -v b="$start" 'BEGIN { printf "%.1f", a - b }')" >> "$GITHUB_ENV"
      - name: Bench in the container
        if: matrix.variant != 'vm'
        run: |
          set -euo pipefail
          # Same paths in every variant: core at /work, bench.sh sets the rest.
          docker run --rm \
            -v "$PWD/core-src:/work" -v "$PWD/bakeoff:/bakeoff:ro" \
            -v "$RUNNER_TEMP/out:/out" -v "$RUNNER_TEMP/iai:/tmp/iai" \
            -w /work "$IMAGE_REF" sh /bakeoff/bench.sh

      # The VM: today's setup, no container. valgrind from apt and the runner
      # from crates.io (core's bench.yml caches the runner between runs; this
      # leg has a cold cache, like the first run after an eviction).
      - name: Set up the VM (apt, cargo install)
        if: matrix.variant == 'vm'
        run: |
          set -euo pipefail
          start=$(date +%s.%N)
          sudo apt-get update
          sudo apt-get install -y valgrind
          cargo install iai-callgrind-runner --version 0.16.1 --locked
          end=$(date +%s.%N)
          echo "SETUP_SECONDS=$(awk -v a="$end" -v b="$start" 'BEGIN { printf "%.1f", a - b }')" >> "$GITHUB_ENV"
      - name: Bench on the VM
        if: matrix.variant == 'vm'
        run: |
          set -euo pipefail
          # The same paths as in the containers.
          sudo mkdir -p /work /tmp/iai
          sudo mount --bind "$PWD/core-src" /work
          sudo mount --bind "$RUNNER_TEMP/iai" /tmp/iai
          cd /work
          OUT="$RUNNER_TEMP/out" sh "$GITHUB_WORKSPACE/bakeoff/bench.sh"

      - name: Stop the job clock
        run: echo "JOB_END=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Collect the counts and timings
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/out/phases.env"
          python3 -I bakeoff/extract.py "$RUNNER_TEMP/iai" > "$RUNNER_TEMP/out/counts.json"
          cat "$RUNNER_TEMP/out/counts.json"
          mkdir -p "$RUNNER_TEMP/out/summaries"
          (cd "$RUNNER_TEMP/iai" && find . -name summary.json -print0 | tar --null -T - -cf -) | tar -xf - -C "$RUNNER_TEMP/out/summaries"
          job_seconds=$(awk -v a="$JOB_END" -v b="$JOB_START" 'BEGIN { printf "%.1f", a - b }')
          jq -n --arg variant "$VARIANT" --argjson run "$RUN_NUMBER" \
            --argjson pull "${PULL_SECONDS:-null}" --argjson setup "${SETUP_SECONDS:-null}" \
            --argjson compile "$compile_seconds" --argjson bench "$bench_seconds" --argjson job "$job_seconds" \
            '{variant: $variant, run: $run, pull_seconds: $pull, setup_seconds: $setup,
              compile_seconds: $compile, bench_seconds: $bench, job_seconds: $job}' > "$RUNNER_TEMP/out/measure.json"
          cat "$RUNNER_TEMP/out/measure.json"
          cat "$RUNNER_TEMP/out/env.txt"

      # The CVE scan: once per image, after the timed part, of the pulled
      # image (Trivy reads it from the local daemon).
      - name: Trivy scan
        if: matrix.variant != 'vm' && matrix.run == 1
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/out/trivy.json
          exit-code: "0"
      - name: Count the CVEs
        if: matrix.variant != 'vm' && matrix.run == 1
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          jq '[.Results[]?.Vulnerabilities[]?] as $v | {
                total: ($v | length),
                high_critical: ([$v[] | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length),
                high_critical_fixed: ([$v[] | select((.Severity == "HIGH" or .Severity == "CRITICAL") and ((.FixedVersion // "") != ""))] | length)
              }' "$out/trivy.json" > "$out/cve.json"
          jq --slurpfile cve "$out/cve.json" '. + {cve: $cve[0]}' "$out/measure.json" > "$out/measure.tmp"
          mv "$out/measure.tmp" "$out/measure.json"
          cat "$out/cve.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: measure-${{ matrix.variant }}-${{ matrix.run }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  report:
    name: report
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Write the tables
        run: |
          set -euo pipefail
          python3 -I bakeoff/report.py "$RUNNER_TEMP/artifacts" > bakeoff/RESULTS.md
          cat bakeoff/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: bakeoff/RESULTS.md
          if-no-files-found: error
          retention-days: 30
