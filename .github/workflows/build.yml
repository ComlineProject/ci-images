name: build

# Four images (bench, fuzz, wasm, tools: images/Dockerfile, one target each),
# each for both architectures. Pull requests build and smoke-test them and run
# core's bench in ci-bench; they never push. Pushes to main and manual runs on
# main also publish ghcr.io/comlineproject/ci-{bench,fuzz,wasm,tools}, with a
# build provenance attestation, and then run core's bench in the published
# ci-bench as a real `container:` job.
#
# The images are reproducible: the same inputs give the same digest (the
# "Reproducible builds" section of images/versions.md). A pull request proves it
# by building each image twice, without a cache, and comparing the digests. A
# publish whose digests are the ones :latest already has pushes nothing new and
# attests nothing: the consumers' Renovate sees no change.
#
# There is no weekly rebuild: the apt packages are pinned to the date of
# DEBIAN_SNAPSHOT in images/Dockerfile, so a rebuild would change nothing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its run; a publish is never cut short.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # core master's HEAD on 2026-11-12: the source the bench check runs on.
  CORE_SHA: f9d53265b82c86502439fea1759e256973865853

jobs:
  # Build each image natively for each architecture, as an OCI archive with
  # the timestamps rewritten to SOURCE_DATE_EPOCH (the date of DEBIAN_SNAPSHOT,
  # images/source-date-epoch.sh), load it into the local daemon and run the
  # smoke test: as root and as another uid, with no network. On a pull request,
  # also build it twice more without any cache and require the same digest.
  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [bench, fuzz, wasm, tools]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(sh images/source-date-epoch.sh)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=docker,name=ci-${{ matrix.image }}:test,rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ci-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}-${{ matrix.arch }}
      - name: Smoke test (root)
        run: docker run --rm --network none -v "$PWD/images/smoke.sh:/smoke.sh:ro" ci-${{ matrix.image }}:test bash /smoke.sh ${{ matrix.image }}
      - name: Smoke test (uid 1001)
        run: docker run --rm --network none --user 1001:1001 -e HOME=/tmp -v "$PWD/images/smoke.sh:/smoke.sh:ro" ci-${{ matrix.image }}:test bash /smoke.sh ${{ matrix.image }}
      # The same image again as an OCI archive (from the build cache, so it is
      # quick): the layers' sizes there are what a pull transfers, and its
      # manifest digest is what the registry will hold.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar,rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ci-${{ matrix.image }}-${{ matrix.arch }}
      - name: Image size
        run: |
          set -euo pipefail
          compressed=$(bash images/oci-size.sh "$RUNNER_TEMP/image.tar")
          uncompressed=$(docker image inspect ci-${{ matrix.image }}:test --format '{{.Size}}')
          echo "ci-${{ matrix.image }} linux/${{ matrix.arch }}: $((compressed / 1000000)) MB compressed ($compressed bytes), $((uncompressed / 1000000)) MB uncompressed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "manifest digest: $(bash images/oci-digest.sh "$RUNNER_TEMP/image.tar")"
      # The reproducibility check: the same image twice, each build with no
      # cache (not the registry's, not the first build's), so every step runs
      # again. The OCI manifest digest of the two exports must be the same.
      - name: Build again, no cache (1)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/repro-1.tar,rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: false
          sbom: false
          no-cache: true
      - name: Build again, no cache (2)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/repro-2.tar,rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: false
          sbom: false
          no-cache: true
      - name: Check the two builds are the same
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          one=$(bash images/oci-digest.sh "$RUNNER_TEMP/repro-1.tar")
          two=$(bash images/oci-digest.sh "$RUNNER_TEMP/repro-2.tar")
          cached=$(bash images/oci-digest.sh "$RUNNER_TEMP/image.tar")
          echo "ci-${{ matrix.image }} linux/${{ matrix.arch }}: build 1 $one, build 2 $two (first build, with cache: $cached)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$one" != "$two" ]; then
            echo "::error::ci-${{ matrix.image }} linux/${{ matrix.arch }} is not reproducible: $one != $two"
            python3 -I images/oci-diff.py "$RUNNER_TEMP/repro-1.tar" "$RUNNER_TEMP/repro-2.tar" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$one" != "$cached" ]; then
            echo "::warning::the cached build differs from the uncached ones: $cached != $one"
            python3 -I images/oci-diff.py "$RUNNER_TEMP/image.tar" "$RUNNER_TEMP/repro-1.tar" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # core's instruction-count bench, in the image as `docker run` (the
      # published image runs it as a `container:` job, below). amd64 only: the
      # counts are per architecture, and this is a does-it-work check.
      - name: Check out core
        if: matrix.image == 'bench' && matrix.arch == 'amd64'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ComlineProject/core
          ref: ${{ env.CORE_SHA }}
          path: core-src
          persist-credentials: false
      - name: Bench in the image
        if: matrix.image == 'bench' && matrix.arch == 'amd64'
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD/core-src:/work" -v "$PWD/images/bench-check.sh:/bench-check.sh:ro" \
            -w /work ci-bench:test sh /bench-check.sh

  # Push each image and architecture by digest, then smoke-test exactly what
  # was pushed. The build is reproducible, so for an unchanged image this is
  # the manifest the registry already holds: the push adds nothing.
  publish:
    name: publish (${{ matrix.image }}, ${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [bench, fuzz, wasm, tools]
        arch: [amd64, arm64]
    env:
      IMAGE: ghcr.io/comlineproject/ci-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(sh images/source-date-epoch.sh)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: images
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ci-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --network none -v "$PWD/images/smoke.sh:/smoke.sh:ro" "$IMAGE@$DIGEST" bash /smoke.sh ${{ matrix.image }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the architectures of each image into one manifest, tag it, attest it,
  # unless :latest already has exactly these per-architecture manifests: then
  # the image is unchanged, its index is only given the new tags (the same
  # digest, nothing new is pushed) and it is not attested again.
  merge:
    name: merge and attest (${{ matrix.image }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [bench, fuzz, wasm, tools]
    env:
      IMAGE: ghcr.io/comlineproject/ci-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long
            type=raw,value=latest
      # Is what was just built what :latest already is? Compare the
      # per-architecture manifests, not the index: the index is derived from
      # them, and a retag must not depend on how it was assembled.
      - name: Compare with :latest
        id: current
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          built=$(printf 'sha256:%s\n' * | sort | tr '\n' ' ')
          latest=$(docker buildx imagetools inspect "$IMAGE:latest" --raw 2> /dev/null \
            | jq -r '[.manifests[]? | select(.platform.os == "linux") | .digest] | sort | join(" ")' || true)
          echo "built:  $built"
          echo "latest: ${latest:-none}"
          if [ "${built% }" = "$latest" ]; then
            digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the manifest list
        if: steps.current.outputs.unchanged != 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      # Unchanged: tag the index :latest already is, as it is. The digest does
      # not change; the sha tags are what the bench job below and Renovate follow.
      - name: Tag the unchanged image
        if: steps.current.outputs.unchanged == 'true'
        env:
          DIGEST: ${{ steps.current.outputs.digest }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$IMAGE@$DIGEST"
      - name: Resolve the digest
        id: digest
        run: |
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "no digest for $tag" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## ci-${{ matrix.image }}"
            echo
            if [ "${{ steps.current.outputs.unchanged }}" = true ]; then
              echo "Unchanged: the digest is the one :latest already had, nothing new was pushed or attested."
              echo
            fi
            echo "Digest: \`$digest\`"
            echo
            echo "Tags: $(jq -r '.tags | map("\`" + . + "\`") | join(", ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
            echo
            echo "Compressed size, as the registry holds it:"
            echo
            docker buildx imagetools inspect --raw "$IMAGE@$digest" > "$RUNNER_TEMP/index.json"
            for m in $(jq -r '.manifests[] | select(.platform.os == "linux") | .platform.architecture + ":" + .digest' "$RUNNER_TEMP/index.json"); do
              size=$(docker buildx imagetools inspect --raw "$IMAGE@${m#*:}" | jq '[.layers[].size] | add')
              echo "- linux/${m%%:*}: $((size / 1000000)) MB ($size bytes)"
            done
            echo
            echo "Use it as:"
            echo
            echo '```yaml'
            echo "container:"
            echo "  image: $IMAGE@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.current.outputs.unchanged != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # The published ci-bench as a real `container:` job, running core's bench:
  # the way a consuming repository's bench job runs it. seccomp=unconfined,
  # because iai-callgrind's runner calls `setarch -R`.
  bench-container:
    name: bench in the published ci-bench
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/comlineproject/ci-bench:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ComlineProject/core
          ref: ${{ env.CORE_SHA }}
          path: core-src
          persist-credentials: false
      - name: Bench
        working-directory: core-src
        run: sh "$GITHUB_WORKSPACE/images/bench-check.sh"
